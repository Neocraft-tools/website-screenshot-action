# Manual self-test of this action. Copy to .github/workflows/self-test.yml in this repository;
# it runs only when started by hand from the Actions tab.
# Requires a repository secret APIFY_TOKEN; cheap inputs (a few cents at most).
name: Self-test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: action
        uses: ./
        with:
          apify-token: ${{ secrets.APIFY_TOKEN }}
          urls: https://example.com
          devices: desktop
          artifact-name: self-test-screenshots
      - name: Show outputs
        run: |
          echo "run-url: ${{ steps.action.outputs.run-url }}"
          echo "results: ${{ steps.action.outputs.results-file }}"
          test -s "${{ steps.action.outputs.results-file }}"
